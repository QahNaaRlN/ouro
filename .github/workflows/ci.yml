name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: ouro_admin
          POSTGRES_PASSWORD: qualification-admin-only
          POSTGRES_DB: ouro_qualification
        ports: [5432:5432]
        options: >-
          --memory 256m --memory-swap 256m
          --health-cmd "pg_isready -U ouro_admin -d ouro_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Check operational shell scripts
        run: sh -n deploy/postgres-init.sh && sh -n scripts/backup-hosted.sh && sh -n scripts/restore-hosted-drill.sh
      - name: Create least-privileged application role and separate disposable databases
        run: |
          docker cp deploy/postgres-init.sh "$PG_CONTAINER:/tmp/ouro-postgres-init.sh"
          docker exec -e POSTGRES_USER=ouro_admin -e POSTGRES_DB=ouro_qualification -e OURO_POSTGRES_APP_PASSWORD=qualification-only "$PG_CONTAINER" sh /tmp/ouro-postgres-init.sh
          docker exec "$PG_CONTAINER" createdb -U ouro_admin --owner=ouro ouro_qualification_empty
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Qualify real PostgreSQL migrations, isolation, concurrency and backup/restore
        run: npm run test:external-pg
        env:
          OURO_TEST_DATABASE_URL: postgresql://ouro:qualification-only@127.0.0.1:5432/ouro_qualification
          OURO_TEST_EMPTY_DATABASE_URL: postgresql://ouro:qualification-only@127.0.0.1:5432/ouro_qualification_empty
          OURO_TEST_ADMIN_DATABASE_URL: postgresql://ouro_admin:qualification-admin-only@127.0.0.1:5432/postgres
          OURO_TEST_DB_CONFIRM: DEDICATED_DISPOSABLE_DATABASES
          OURO_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Build non-root production image with native dependencies and current protocol
        run: docker build --target runner -t ouro:qualification .
      - name: Qualify production image with bounded PostgreSQL, password login and SSE
        run: node scripts/smoke-hosted-image.mjs
        env:
          OURO_SMOKE_IMAGE: ouro:qualification
          OURO_TEST_DATABASE_URL: postgresql://ouro:qualification-only@127.0.0.1:5432/ouro_qualification
          OURO_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Export the exact qualified production image and provenance
        run: node scripts/export-hosted-image.mjs
      - name: Preserve the qualified hosted image for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ouro-hosted-image-${{ github.sha }}
          path: artifacts/hosted-image/
          if-no-files-found: error
          retention-days: 7

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Check pull request conventions
        if: github.event_name == 'pull_request'
        run: npm run check:conventions
        env:
          OURO_CONVENTIONS_BRANCH: ${{ github.head_ref }}
          OURO_CONVENTIONS_TITLE: ${{ github.event.pull_request.title }}
          OURO_CONVENTIONS_BASE: ${{ github.event.pull_request.base.sha }}
          OURO_CONVENTIONS_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Check integration history conventions
        if: github.event_name == 'push'
        run: npm run check:conventions -- --all
        env:
          OURO_CONVENTIONS_BRANCH: ${{ github.ref_name }}
      - name: Install dependencies
        run: npm ci
      - name: Install isolated service qualification dependencies
        run: npm --prefix apps/service ci
      - name: Run unit and integration tests
        run: npm test
      - name: Check and build the isolated service runtime
        run: |
          npm --prefix apps/service run typecheck
          npm --prefix apps/service run build
      - name: Qualify all service routes, lifecycle and built artifact over TCP
        run: npm --prefix apps/service test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify canonical protocol schemas
        run: npm run protocol:check
      - name: Verify independent protocol installation
        run: npm run protocol:test-package
      - name: Check durable database replay
        run: npm run db:check
      - name: Build production application
        run: npm run build

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser acceptance
        run: npm run test:e2e:production
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
