name: ouro-production
services:
  db:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ouro
      POSTGRES_USER: ouro_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set protected POSTGRES_ADMIN_PASSWORD}
      OURO_POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?set protected application POSTGRES_PASSWORD}
    volumes:
      - ouro_postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-ouro-role.sh:ro
    networks: [ouro_internal]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ouro_admin -d ouro"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: ${OURO_IMAGE:?set qualified immutable OURO_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      OURO_DEPLOYMENT_MODE: cloud
      OURO_LOCAL_DEMO: "0"
      OURO_PUBLIC_URL: https://ouroapp.ru
      DATABASE_URL: postgresql://ouro:${POSTGRES_PASSWORD:?set protected POSTGRES_PASSWORD}@db:5432/ouro
      OURO_SMTP_URL: ${OURO_SMTP_URL:-}
      OURO_SMTP_HOST: ${OURO_SMTP_HOST:-}
      OURO_SMTP_PORT: ${OURO_SMTP_PORT:-}
      OURO_SMTP_SECURE: ${OURO_SMTP_SECURE:-}
      OURO_SMTP_USER: ${OURO_SMTP_USER:-}
      OURO_SMTP_PASSWORD: ${OURO_SMTP_PASSWORD:-}
      OURO_MAIL_FROM: ${OURO_MAIL_FROM:-}
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      db:
        condition: service_healthy
    networks:
      ouro_internal:
      ouro_edge:
        aliases: [ouro-app]
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  ouro_postgres:
networks:
  ouro_internal:
    internal: true
  ouro_edge:
    external: true
    name: ${OURO_EDGE_NETWORK:-grace-production_edge}
